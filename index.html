<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dora Balog</title>
  <meta name="description" content="Dora Balog — projects, publications, and news.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="nav-name" id="nav-name"></a>
      <div class="nav-links">
        <a href="#projects">Projects</a>
        <a href="#publications">Publications</a>
        <a href="#talks">Talks</a>
        <a href="#awards">Awards</a>
        <a href="#certifications">Courses</a>
        <a href="#news">News</a>
      </div>
    </div>
  </nav>

  <main id="top">
    <section class="wrap hero">
      <img class="headshot" id="photo" alt="">
      <div class="hero-text">
        <h1 id="name"></h1>
        <p class="tagline" id="tagline"></p>
        <div class="bio" id="bio"></div>
        <div class="social" id="social"></div>
      </div>
    </section>

    <section class="wrap section" id="projects">
      <h2>Projects</h2>
      <div class="grid" id="project-list"></div>
    </section>

    <section class="wrap section" id="publications">
      <h2>Publications</h2>
      <div class="list" id="publication-list"></div>
    </section>

    <section class="wrap section" id="reviews">
      <h2>Peer Review</h2>
      <div class="review-grid" id="review-list"></div>
    </section>

    <section class="wrap section" id="talks">
      <h2>Talks &amp; Posters</h2>
      <div class="list" id="talk-list"></div>
    </section>

    <section class="wrap section" id="awards">
      <h2>Awards &amp; Fellowships</h2>
      <div class="list" id="award-list"></div>
    </section>

    <section class="wrap section" id="certifications">
      <h2>Certifications &amp; Courses</h2>
      <div class="list" id="cert-list"></div>
    </section>

    <section class="wrap section" id="news">
      <h2>News &amp; Media</h2>
      <div class="list" id="news-list"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <span id="footer-text"></span>
  </footer>

  <script>
    // Load content fresh each visit so edits show up right away (no stale browser cache).
    (function () {
      var v = Date.now();
      var c = document.createElement("script");
      c.src = "content.js?v=" + v;
      c.onload = function () {
        var r = document.createElement("script");
        r.src = "render.js?v=" + v;
        document.body.appendChild(r);
      };
      document.body.appendChild(c);
    })();
  </script>
</body>
</html>
